<script type="module">
"use strict";
// ════════════════════════════════════════════════════════════════
// ΝΟΥΣ — offline-first personal assistant
// Online: Claude builds the knowledge base (atomic facts + embeddings)
// Offline: local retrieval + context manager + WebLLM (~1.5B) voice
// ════════════════════════════════════════════════════════════════
const APP_VERSION = "v3k";
const LS = { facts:"nous.facts", profile:"nous.profile", sessions:"nous.sessions",
             gaps:"nous.gaps", settings:"nous.settings", reflect:"nous.reflect", reports:"nous.reports" };

// Ordered safest-first: iOS caps each web-content process well below device RAM,
// so weight size — not the phone's total memory — is what decides survival.
// `risk` drives the warning shown under the picker.
const WEBLLM_MODELS = [
  { id:"Llama-3.2-1B-Instruct-q4f16_1-MLC", label:"Llama 3.2 1B (~700MB \u2014 best balance on iPhone)", mb:700, risk:"ok" },
  { id:"Qwen2.5-0.5B-Instruct-q4f16_1-MLC", label:"Qwen 2.5 0.5B (~400MB \u2014 safest, weakest answers)", mb:400, risk:"safe" },
  { id:"Qwen2.5-1.5B-Instruct-q4f16_1-MLC", label:"Qwen 2.5 1.5B (~950MB \u2014 tight on iPhone)", mb:950, risk:"tight" },
  { id:"Qwen2.5-3B-Instruct-q4f16_1-MLC", label:"Qwen 2.5 3B (~1.9GB \u2014 desktop browsers only)", mb:1900, risk:"desktop" },
];
const modelInfo = id => WEBLLM_MODELS.find(m=>m.id===id) || { label:id, mb:0, risk:"ok" };

// Memory profile. WebLLM allocates the KV cache for the FULL context window at
// load time, so an oversized window costs hundreds of MB we never use — our
// assembled prompt is only ~2.8K tokens. Pinning the window is the single
// biggest lever we have short of a smaller model.
function memProfile(){
  return settings.lowMem
    ? { ctx:2048, prefill:256, budget:1500, maxOut:220 }
    : { ctx:4096, prefill:512, budget:2800, maxOut:300 };
}
const EMBED_MODEL = "Xenova/all-MiniLM-L6-v2";
const SIM_THRESHOLD = 0.30;      // below this, retrieval counts as a gap
// TOKEN_BUDGET now comes from memProfile() so it always tracks the context window
const approxTok = s => Math.ceil((s||"").length / 4);

// ── storage: IndexedDB (via idb-keyval) with a synchronous in-memory cache ──
// save() stays synchronous in signature (writes cache, fires async to IDB), so
// all existing call sites are unchanged. Everything loads once at startup.
let idbSet = null, idbGet = null;          // bound after dynamic import
const memCache = {};                        // key -> parsed value (source of truth in RAM)
function load(k, fb){ return (k in memCache) ? memCache[k] : fb; }
function save(k, v){
  memCache[k] = v;
  if(idbSet){ idbSet(k, v).catch(e=>console.error("idb save", k, e)); }
  else { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } // pre-init fallback
}

// declared now, populated in initStorage() before first render
let facts=[], profile={ text:"", name:"", location:"" }, sessions=[], gaps=[],
    settings={}, reflect={ lastRun:0, proposals:[] }, reports=[],
    research={ running:false, log:[], report:null };
let tab = "chat";
let session = { id:Date.now(), started:Date.now(), turns:[] };
let chatMenu = false;      // history drawer open?
let chatFull = false;      // render every turn vs the last CHAT_WINDOW

const MAX_SESSIONS = 50;   // was 20 — sessions are browsable now, so keep more
const CHAT_WINDOW = 60;    // turns rendered before "show earlier" kicks in

// Single place that mints a chat. Drops leftover empty sessions so tapping
// "New" twice doesn't litter the history with blanks.
function startSession(extra){
  sessions = sessions.filter(s => s && s.turns && s.turns.length);
  session = Object.assign({ id:Date.now(), started:Date.now(), updated:Date.now(), turns:[] }, extra||{});
  sessions.push(session);
  if(sessions.length>MAX_SESSIONS) sessions = sessions.slice(-MAX_SESSIONS);
  chatFull = false; chatMenu = false;
  save(LS.sessions, sessions);
  return session;
}
function sessionTitle(s){
  if(s?.reportContext?.topic) return "Report — " + s.reportContext.topic;
  const u = (s?.turns||[]).find(t => t.role==="user");
  if(u) return u.text.length>52 ? u.text.slice(0,52)+"…" : u.text;
  return (s?.turns||[]).length ? "Chat" : "New chat";
}
function sessionWhen(s){
  const t = s?.updated || s?.started || s?.id || Date.now();
  const d = new Date(t), now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  return sameDay ? d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})
                 : d.toLocaleDateString([], {month:"short", day:"numeric"});
}

async function initStorage(){
  // Ask the OS to keep our IndexedDB + cached model weights from being evicted
  try{ if(navigator.storage && navigator.storage.persist){ await navigator.storage.persist(); } }catch(e){}
  try{
    const idb = await import("https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm");
    idbGet = idb.get; idbSet = idb.set;
  }catch(e){ console.error("idb import failed, using localStorage", e); }

  const read = async (k, fb) => {
    if(idbGet){
      try{ const v = await idbGet(k); if(v !== undefined) return v; }catch(e){}
    }
    // one-time migration from old localStorage (or fallback if idb unavailable).
    // We AWAIT the idb write then delete the localStorage copy: leaving it behind
    // meant an idb miss (eviction/failed write) silently rolled the app back to a
    // frozen pre-v3e snapshot — old settings, old model, old facts.
    try{ const ls = localStorage.getItem(k); if(ls != null){ const parsed = JSON.parse(ls);
      if(idbSet){ try{ await idbSet(k, parsed); localStorage.removeItem(k); }catch(e){} }
      return parsed; } }catch(e){}
    return fb;
  };

  facts    = await read(LS.facts, []);
  profile  = await read(LS.profile, { text:"", name:"", location:"" });
  sessions = await read(LS.sessions, []);
  gaps     = await read(LS.gaps, []);
  settings = await read(LS.settings, {});
  reflect  = await read(LS.reflect, { lastRun:0, proposals:[] });
  reports  = await read(LS.reports, []);

  // settings defaults / migrations
  const sd = { apiKey:"", claudeModel:"claude-sonnet-5", planModel:"claude-haiku-4-5-20251001",
    webllmModel:WEBLLM_MODELS[0].id, tts:true, ttsRate:1.0, ttsVoice:"", ttsPitch:1.0, route:"auto",
    proxyUrl:"https://curly-term-5539.dbazos1.workers.dev/", researchDepth:2 };
  settings = Object.assign({}, sd, settings);
  if(!settings.proxyUrl) settings.proxyUrl = sd.proxyUrl;
  if(!settings.planModel) settings.planModel = sd.planModel;
  if(settings.researchDepth===undefined) settings.researchDepth = 2;
  if(settings.claudeModel==="claude-sonnet-4-6") settings.claudeModel = "claude-sonnet-5";

  // prime memCache so synchronous save() has the current values
  memCache[LS.facts]=facts; memCache[LS.profile]=profile; memCache[LS.sessions]=sessions;
  memCache[LS.gaps]=gaps; memCache[LS.settings]=settings; memCache[LS.reflect]=reflect;
  memCache[LS.reports]=reports;

  // A marker left over from last launch means the process was killed mid-run
  // (iOS jetsam) rather than closed cleanly. Capture it, then clear.
  if(settings.activeRun){
    lastCrash = { ...settings.activeRun };
    delete settings.activeRun;
    save(LS.settings, settings);
  }

  // RESUME the most recent chat instead of always starting fresh (v3h).
  // iOS kills backgrounded PWAs constantly; a new session per launch meant the
  // conversation appeared to vanish every time. New chats are now explicit only.
  const last = sessions[sessions.length-1];
  if(last && Array.isArray(last.turns)) session = last;
  else startSession();
  save(LS.sessions, sessions);
}

let busy = false;
let engine = null, engineModel = null, engineLoading = false;
let embedPipe = null, embedLoading = false;

// ── embeddings (Transformers.js, WASM — works with or without WebGPU) ──
async function getEmbedder(status){
  if(embedPipe) return embedPipe;
  if(embedLoading) throw new Error("Embedder still loading");
  embedLoading = true;
  try{
    if(status) status("Loading embedding model (~25MB, first time only)…");
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.1/dist/transformers.min.js");
    embedPipe = await T.pipeline("feature-extraction", EMBED_MODEL, { dtype:"q8" });
    return embedPipe;
  } finally { embedLoading = false; }
}
async function embedText(text, status){
  const pipe = await getEmbedder(status);
  const out = await pipe(text, { pooling:"mean", normalize:true });
  return Array.from(out.data); // Float32 -> plain array (384 dims, unit norm)
}
// int8 quantize <-> base64 for compact localStorage
function encVec(v){ const a = new Int8Array(v.length); for(let i=0;i<v.length;i++) a[i]=Math.max(-127,Math.min(127,Math.round(v[i]*127)));
  let s=""; const b=new Uint8Array(a.buffer); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function decVec(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  const a=new Int8Array(b.buffer); const v=new Float32Array(a.length); for(let i=0;i<a.length;i++) v[i]=a[i]/127; return v; }
function cosine(q, b64){ const f = decVec(b64); let d=0, nq=0, nf=0;
  for(let i=0;i<q.length;i++){ d+=q[i]*f[i]; nq+=q[i]*q[i]; nf+=f[i]*f[i]; }
  return d / (Math.sqrt(nq)*Math.sqrt(nf) || 1); }

// ── Claude API (BYO key) ──
async function claudeRaw(body){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":settings.apiKey,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || "HTTP "+res.status); }
  return res.json();
}
async function claudeStream(body, onToken){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":settings.apiKey,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ ...body, stream:true })
  });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || "HTTP "+res.status); }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let full = "", buf = "";
  while(true){
    const { done, value } = await reader.read(); if(done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split("\n"); buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data:")) continue;
      try{ const ev = JSON.parse(line.slice(5).trim());
        if(ev.type==="content_block_delta" && ev.delta?.type==="text_delta"){
          full += ev.delta.text; if(onToken) onToken(full);
        }
      }catch(e){}
    }
  }
  return full.trim();
}
async function claude(messages, opts={}){
  const body = { model: opts.model || settings.claudeModel, max_tokens: opts.maxTokens||3000, messages: [...messages] };
  if(opts.system) body.system = opts.system;
  const tools = [];
  if(opts.webSearch) tools.push({ type:"web_search_20250305", name:"web_search" });
  if(opts.dataTools) tools.push(...NOUS_TOOLS);
  if(tools.length) body.tools = tools;
  // stream only when caller asks AND no tools (tool loop needs full blocks)
  if(opts.onToken && !tools.length){ return claudeStream(body, opts.onToken); }

  // tool-use loop (for our data tools; web_search is server-side and needs no loop)
  for(let hop=0; hop<4; hop++){
    const data = await claudeRaw(body);
    const toolUses = (data.content||[]).filter(b=>b.type==="tool_use");
    const ourUses = toolUses.filter(t=>NOUS_TOOL_NAMES.includes(t.name));
    if(!ourUses.length){
      return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
    }
    // execute our tools, feed results back
    body.messages.push({ role:"assistant", content:data.content });
    const results = [];
    for(const u of ourUses){
      const out = await runNousTool(u.name, u.input);
      results.push({ type:"tool_result", tool_use_id:u.id, content: JSON.stringify(out).slice(0,4000) });
    }
    body.messages.push({ role:"user", content: results });
  }
  // safety exit
  const final = await claudeRaw(body);
  return final.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

// Tool definitions Claude can call (online orchestration on top of the deterministic layer)
const NOUS_TOOLS = [
  { name:"get_stock_quote", description:"Get current/recent price, day range, 52-week range, volume, and market cap for a stock ticker. Use exchange suffixes for non-US (e.g. TOU.TO for Toronto).",
    input_schema:{ type:"object", properties:{ symbol:{type:"string", description:"Ticker, e.g. AAPL or TOU.TO"} }, required:["symbol"] } },
  { name:"get_economic_series", description:"Get a recent US economic/commodity data series from FRED. Series IDs: DGS10 (10yr yield), FEDFUNDS, CPIAUCSL (CPI), UNRATE, DCOILWTICO (WTI oil), DHHNGSP (Henry Hub gas), DEXCAUS (CAD/USD).",
    input_schema:{ type:"object", properties:{ series:{type:"string", description:"FRED series ID"} }, required:["series"] } },
  { name:"get_weather", description:"Get current conditions and multi-day forecast for a location by coordinates.",
    input_schema:{ type:"object", properties:{ lat:{type:"number"}, lon:{type:"number"} }, required:["lat","lon"] } },
  { name:"geocode_place", description:"Resolve a place name (city, town) to latitude/longitude before calling get_weather.",
    input_schema:{ type:"object", properties:{ place:{type:"string"} }, required:["place"] } },
  { name:"get_country_data", description:"Get country development data from World Bank. indicator e.g. NY.GDP.MKTP.CD (GDP), SP.POP.TOTL (population), FP.CPI.TOTL.ZG (inflation). country is ISO2 e.g. CA, GR, US.",
    input_schema:{ type:"object", properties:{ indicator:{type:"string"}, country:{type:"string"} }, required:["indicator","country"] } },
];
const NOUS_TOOL_NAMES = NOUS_TOOLS.map(t=>t.name);
async function runNousTool(name, input){
  try{
    if(name==="get_stock_quote") return await fetchQuote(input.symbol);
    if(name==="get_economic_series") return await fetchMacro(input.series);
    if(name==="get_weather") return await fetchWeather(input.lat, input.lon);
    if(name==="get_country_data") return await fetchCountry(input.indicator, input.country);
    if(name==="geocode_place") return await fetchGeocode(input.place);
  }catch(e){ return { error: e.message }; }
  return { error: "unknown tool" };
}
function parseJSON(raw){
  if(!raw || typeof raw !== "string") throw new Error("empty AI response");
  let clean = raw.replace(/```json|```/g,"").trim();
  // find the first { or [ and the matching last } or ]
  const firstObj = clean.indexOf("{"), firstArr = clean.indexOf("[");
  const cands = [firstObj, firstArr].filter(i=>i>=0);
  if(!cands.length) throw new Error("no JSON found in AI response: " + clean.slice(0,120));
  const start = Math.min(...cands);
  const lastObj = clean.lastIndexOf("}"), lastArr = clean.lastIndexOf("]");
  const end = Math.max(lastObj, lastArr);
  const slice = (end > start) ? clean.slice(start, end+1) : clean.slice(start);
  try{ return JSON.parse(slice); }
  catch(e){
    // last-ditch: strip trailing commas and retry
    try{ return JSON.parse(slice.replace(/,(\s*[}\]])/g, "$1")); }
    catch(e2){ throw new Error("could not parse AI JSON (" + e.message + ")"); }
  }
}

// Pull complete {...} objects out of a (possibly truncated) JSON array.
// Brace-depth scan that respects strings/escapes, so a response cut off at
// max_tokens still yields every fact that finished serializing.
function salvageObjects(text){
  const out = []; let depth=0, start=-1, inStr=false, esc=false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inStr){ if(esc) esc=false; else if(ch==="\\") esc=true; else if(ch==='"') inStr=false; continue; }
    if(ch==='"'){ inStr=true; continue; }
    if(ch==="{"){ if(depth===0) start=i; depth++; }
    else if(ch==="}"){ if(depth>0){ depth--;
      if(depth===0 && start>=0){ try{ out.push(JSON.parse(text.slice(start,i+1))); }catch(e){} start=-1; } } }
  }
  return out;
}
// Card arrays are the one thing we must never lose to a parse error.
function parseCards(raw, key){
  try{
    const o = parseJSON(raw);
    if(o && Array.isArray(o[key]) && o[key].length) return o[key];
    if(Array.isArray(o) && o.length) return o;
  }catch(e){}
  const clean = String(raw||"").replace(/```json|```/g,"");
  const ki = clean.indexOf('"'+key+'"');
  const from = ki>=0 ? clean.indexOf("[", ki) : clean.indexOf("[");
  if(from < 0) return [];
  return salvageObjects(clean.slice(from+1)).filter(o => o && typeof o.text === "string");
}

// ── fact store ──
async function addFacts(cards, source, status){
  let added = 0;
  for(const c of cards){
    if(!c.text) continue;
    if(facts.find(f => f.status!=="superseded" && f.text.toLowerCase() === c.text.trim().toLowerCase())) continue; // dedupe
    // supersede: archive any old fact this one explicitly replaces
    if(Array.isArray(c.replaces)){
      for(const oldText of c.replaces){
        const victim = facts.find(f => f.status!=="superseded" &&
          f.text.toLowerCase() === String(oldText).trim().toLowerCase());
        if(victim){ victim.status = "superseded"; victim.supersededBy = c.text.trim(); victim.supersededAt = Date.now(); }
      }
    }
    if(status) status(`Embedding ${added+1}/${cards.length}…`);
    try{
      const vec = await embedText(c.text, status);
      facts.push({ id:Date.now()+Math.random(), text:c.text.trim(),
        category:["identity","ambient","interest","episodic","procedure"].includes(c.category)?c.category:"episodic",
        aliases:Array.isArray(c.aliases)?c.aliases.slice(0,8):[],
        source, confidence:c.confidence||"medium", status:"active",
        created:Date.now(), verified:Date.now(), emb:encVec(vec) });
      added++;
    }catch(e){
      // one bad fact must not discard the whole batch
      console.error("embed failed", c.text?.slice(0,60), e);
    }
  }
  save(LS.facts, facts);
  return added;
}
function ageOf(f){ const d = Math.floor((Date.now()-(f.verified||f.created))/86400000);
  return d<1?"today":d<30?d+"d ago":Math.floor(d/30)+"mo ago"; }

// ── retrieval ──
// keyword/exact-match score: rewards facts containing the query's distinctive tokens
// (part numbers, tickers, names) that semantic embeddings can rank too low.
function keywordScore(queryTokens, fact){
  if(!queryTokens.length) return 0;
  const hay = (fact.text + " " + (fact.aliases||[]).join(" ")).toLowerCase();
  let hit = 0;
  for(const tok of queryTokens){
    if(hay.includes(tok)){
      hit += 1;
      // bonus for alphanumeric/technical tokens (contain a digit or a dot) — exact strings matter most
      if(/[0-9.]/.test(tok)) hit += 0.5;
    }
  }
  return hit / queryTokens.length;   // 0..1.5-ish, normalized by token count
}
function tokenize(q){
  return q.toLowerCase().match(/[a-z0-9][a-z0-9.\-]{1,}/gi)?.filter(t=>t.length>1
    && !["the","and","for","what","how","was","are","with","this","that","from"].includes(t)) || [];
}

async function retrieve(query, k=6, status){
  if(facts.length===0) return { hits:[], best:0 };
  // alias expansion
  let expanded = query;
  const ql = query.toLowerCase();
  const extra = new Set();
  for(const f of facts) for(const a of (f.aliases||[]))
    if(ql.includes(a.toLowerCase())) (f.aliases||[]).forEach(x=>extra.add(x));
  if(extra.size) expanded += " " + [...extra].slice(0,10).join(" ");
  const q = await embedText(expanded, status);
  const qTokens = tokenize(query);
  // hybrid: 0.7 * cosine + 0.3 * keyword — surfaces exact names/numbers reliably
  const active = facts.filter(f => f.status !== "superseded");
  const scored = active.map(f=>{
    const cos = cosine(q, f.emb);
    const kw = keywordScore(qTokens, f);
    return { f, cos, kw, s: 0.7*cos + 0.3*Math.min(kw,1) };
  }).sort((a,b)=>b.s-a.s);
  // Hybrid score RANKS. The gate uses raw cosine (what SIM_THRESHOLD was tuned
  // for) or a solid keyword hit — v3g gated on the blended score, which silently
  // raised the effective cosine bar from 0.30 to 0.43 and buried good facts.
  const hits = scored.slice(0, k).filter(x => x.cos >= SIM_THRESHOLD || x.kw >= 0.5);
  return { hits, best: scored[0]?.cos || 0 };
}

// ── context manager (the star): fill a fixed budget by priority ──
function assembleOffline(question, hits, reportCtx, liveBlocks){
  let budget = memProfile().budget - 350;        // reserve for the answer
  const parts = [];
  // 1. profile (frozen, always in)
  const today = new Date().toDateString();
  let sys = `You are ΝΟΥΣ, a personal assistant. Today is ${today}. Be concise, warm, direct. `+
            `Answer ONLY from the profile and stored facts below plus the conversation. `+
            `If they don't contain the answer, say plainly you don't have that stored (it will be researched later) — never invent facts.`;
  if(profile.text) sys += `\n\nUSER PROFILE:\n${profile.text}`;
  if(liveBlocks && liveBlocks.length){
    sys += `\n\nLIVE DATA (current figures, use these exactly):\n${liveBlocks.join("\n")}`; }
  if(reportCtx){ const excerpt = reportCtx.text.slice(0, 4800);
    sys += `\n\nThe user is discussing this research report "${reportCtx.topic}". Answer from it:\n${excerpt}`; }
  budget -= approxTok(sys);
  // 2. retrieved facts (with age so the model can hedge)
  if(hits.length){
    let fx = "\n\nSTORED FACTS (with age):";
    for(const {f} of hits){
      const line = `\n- [${f.category}, ${ageOf(f)}] ${f.text}`;
      if(approxTok(fx+line) > budget*0.6) break;   // facts may take up to ~60% of what's left
      fx += line;
    }
    sys += fx; budget -= approxTok(fx);
  } else {
    sys += "\n\nSTORED FACTS: none relevant to this question.";
  }
  // 3. session history (recent verbatim, oldest dropped first)
  const msgs = [];
  const hist = session.turns.slice(-8);
  let used = approxTok(question);
  for(let i=hist.length-1; i>=0; i--){
    const t = approxTok(hist[i].text);
    if(used + t > budget) break;
    msgs.unshift({ role: hist[i].role==="user"?"user":"assistant", content: hist[i].text });
    used += t;
  }
  msgs.push({ role:"user", content: question });
  return { system: sys, messages: msgs };
}

// ── WebLLM ──
function webgpuOK(){ return !!navigator.gpu; }
async function getEngine(status){
  if(engine && engineModel===settings.webllmModel) return engine;
  if(engineLoading) throw new Error("Model still loading");
  engineLoading = true;
  try{
    // switching models: release the previous weights first, or the phone holds
    // two multi-hundred-MB models and Safari kills the tab
    if(engine && engineModel !== settings.webllmModel){
      if(status) status("Releasing previous model…");
      try{ if(engine.unload) await engine.unload(); }catch(e){ console.error("unload", e); }
      engine = null; engineModel = null;
    }
    if(status) status("Loading chat model — first time downloads weights…");
    const { CreateMLCEngine } = await import("https://esm.run/@mlc-ai/web-llm");
    const wanted = settings.webllmModel;
    const mp = memProfile();
    const initCfg = { initProgressCallback: p => { if(status) status(p.text||"loading…", p.progress); } };
    // Cap the KV cache to what we actually use. Without this WebLLM allocates the
    // model's default window (often 4-32K tokens) up front — pure waste against a
    // ~2.8K prompt, and the difference between loading and being jetsam-killed.
    const chatOpts = { context_window_size: mp.ctx, prefill_chunk_size: mp.prefill };
    markRun("loading "+modelInfo(wanted).label);
    try{
      engine = await CreateMLCEngine(wanted, initCfg, chatOpts);
    }catch(e){
      // only retry bare if the override itself was rejected — never after an OOM,
      // where retrying with a bigger window would just fail harder
      if(/unknown|invalid|unsupported|not a valid|chatopts|context_window|prefill/i.test(e.message||"")){
        if(status) status("Retrying with default context settings…");
        engine = await CreateMLCEngine(wanted, initCfg);
      } else throw e;
    }
    clearRun();
    engineModel = wanted;
    // remember what's actually on disk so Settings can mark it
    if(!Array.isArray(settings.webllmDownloaded)) settings.webllmDownloaded = [];
    if(!settings.webllmDownloaded.includes(wanted)){
      settings.webllmDownloaded.push(wanted); save(LS.settings, settings);
    }
    return engine;
  } finally { engineLoading = false; }
}
// ── crash breadcrumb ──
// A jetsam kill gives us no error and no unload hook — the process simply dies.
// So we write a marker before risky work and clear it after; a marker still
// present at next boot means the previous run was killed, almost always OOM.
let lastCrash = null;
function markRun(phase){
  settings.activeRun = { phase, model: settings.webllmModel, lowMem: !!settings.lowMem, ts: Date.now() };
  save(LS.settings, settings);
}
function clearRun(){ if(settings.activeRun){ delete settings.activeRun; save(LS.settings, settings); } }

async function localGenerate(system, messages, status, onToken){
  const eng = await getEngine(status);
  const mp = memProfile();
  markRun("generating a reply");
  try{
    if(onToken){
      const chunks = await eng.chat.completions.create({
        messages: [{ role:"system", content: system }, ...messages],
        temperature: 0.6, max_tokens: mp.maxOut, stream: true });
      let full = "";
      for await (const chunk of chunks){
        const delta = chunk.choices?.[0]?.delta?.content || "";
        if(delta){ full += delta; onToken(full); }
      }
      return full.trim();
    }
    const r = await eng.chat.completions.create({
      messages: [{ role:"system", content: system }, ...messages],
      temperature: 0.6, max_tokens: mp.maxOut });
    return r.choices[0].message.content.trim();
  } finally { clearRun(); }
}

// ── TTS ──
// iOS populates getVoices() asynchronously and often only after the first
// speak(), so we cache, listen for voiceschanged, and re-render Settings.
let voiceList = [];
function loadVoices(){
  try{ voiceList = (speechSynthesis.getVoices()||[]).filter(v=>v && v.name); }catch(e){ voiceList = []; }
  return voiceList;
}
function pickVoice(){
  const list = voiceList.length ? voiceList : loadVoices();
  if(!settings.ttsVoice) return null;
  return list.find(v => v.voiceURI===settings.ttsVoice) ||
         list.find(v => v.name===settings.ttsVoice) || null;
}
try{
  loadVoices();
  if(typeof speechSynthesis !== "undefined")
    speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); if(tab==="set") renderTab(); });
}catch(e){}

function speak(text){
  if(!settings.tts) return;
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = settings.ttsRate || 1.0;
    u.pitch = (settings.ttsPitch===undefined) ? 1.0 : settings.ttsPitch;
    const v = pickVoice();
    if(v){ u.voice = v; if(v.lang) u.lang = v.lang; }
    speechSynthesis.speak(u);
  }catch(e){}
}

// ── live streaming into the chat without full re-render ──

// ── chat send: route online (Claude) / offline (retrieval + WebLLM) ──
async function sendMsg(){
  const inp = document.getElementById("chatIn");
  const q = inp.value.trim();
  if(!q || busy) return;
  inp.value = ""; busy = true;
  session.turns.push({ role:"user", text:q, ts:Date.now() });
  session.updated = Date.now();
  save(LS.sessions, sessions);
  render();
  const online = navigator.onLine && settings.apiKey && settings.route!=="offline";
  try{
    let reply, via;
    const { hits, best } = await retrieve(q, 6, setChatStatus);
    // Live data (stock/macro) when online — deterministic, and Claude gets it as context
    let liveBlocks = [];
    if(online && settings.proxyUrl){
      const needsData = detectTicker(q) || detectMacro(q).length || detectWeather(q);
      if(needsData){
        setChatStatus("Fetching live data…");
        const live = await gatherLiveData(q, {});
        liveBlocks = live.blocks;
      }
    }
    if(online){
      via = "claude · online" + (liveBlocks.length ? " · live data" : "");
      let sys = `You are ΝΟΥΣ, the user's personal assistant. Be concise, warm, direct. Today is ${new Date().toDateString()}.`;
      if(profile.text) sys += `\nUSER PROFILE:\n${profile.text}`;
      if(liveBlocks.length) sys += `\n\nLIVE DATA (use these exact figures; quotes may be delayed, not real-time):\n${liveBlocks.join("\n")}`;
      if(session.reportContext) sys += `\n\nThe user is asking about this research report titled "${session.reportContext.topic}":\n${session.reportContext.text.slice(0,9000)}`;
      if(hits.length) sys += `\nSTORED FACTS:\n${hits.map(h=>"- "+h.f.text).join("\n")}`;
      const msgs = session.turns.slice(-10).map(t=>({ role:t.role==="user"?"user":"assistant", content:t.text }));
      // stream unless data-tools are active (tool loop needs whole blocks)
      const canStream = !settings.proxyUrl; // dataTools on when proxy set
      setChatStatus("");
      beginStream(via);
      reply = await claude(msgs, { system: sys, maxTokens: 700, dataTools: !!settings.proxyUrl,
        onToken: canStream ? liveStreamToken : null });
      endStream();
    } else {
      if(!webgpuOK()) throw new Error("Offline chat needs WebGPU (iOS 26+ Safari). Connect online or update iOS.");
      via = `local · ${hits.length} facts`;
      if(!hits.length){
        gaps.push({ q, ts:Date.now() }); save(LS.gaps, gaps);
        via = "local · gap logged";
      }
      // even in local mode, if we have connectivity, ground stock/macro Qs with live data
      let localLive = [];
      if(navigator.onLine && settings.proxyUrl && (detectTicker(q) || detectMacro(q).length || detectWeather(q))){
        setChatStatus("Fetching live data…");
        const live = await gatherLiveData(q, {});
        localLive = live.blocks;
        if(localLive.length) via += " · live data";
      }
      const { system, messages } = assembleOffline(q, hits, session.reportContext, localLive);
      setChatStatus("");
      beginStream(via);
      reply = await localGenerate(system, messages, setChatStatus, liveStreamToken);
      endStream();
    }
    session.turns.push({ role:"ai", text:reply, via, ts:Date.now() });
    session.updated = Date.now();
    save(LS.sessions, sessions);
    speak(reply);
    streamEl = null;
  }catch(e){
    let msg = "⚠ "+e.message;
    // OOM surfaces as opaque WebGPU/allocation errors — translate it
    if(!navigator.onLine || settings.route==="offline"){
      if(/out of memory|allocat|device.*lost|webgpu|createBuffer|oom/i.test(e.message||"")){
        const cm = modelInfo(settings.webllmModel);
        msg = `⚠ The local model ran out of memory (${cm.label}).\n\n` +
          (settings.lowMem ? "Low-memory mode is already on, so try a smaller model in ⚙ Settings."
                           : "Turn on low-memory mode in ⚙ Settings, or pick a smaller model.");
      }
    }
    session.turns.push({ role:"ai", text:msg, via:"error", ts:Date.now() });
    session.updated = Date.now();
    save(LS.sessions, sessions);
  }
  busy = false; setChatStatus(""); render();
}
function setChatStatus(t, p){

// ── search proxy (Brave via Cloudflare Worker) ──
let lastSearchAt = 0;
let proxyQueue = Promise.resolve();                    // serialize all proxy calls (no 429 races)
function pacedSlot(){
  // chain onto the queue; each slot resolves >=1150ms after the previous one started
  const run = proxyQueue.then(async () => {
    const wait = 1150 - (Date.now() - lastSearchAt);
    if(wait > 0) await new Promise(r=>setTimeout(r, wait));
    lastSearchAt = Date.now();
  });
  proxyQueue = run.catch(()=>{});                       // keep the chain alive on errors
  return run;
}
async function braveSearch(query, freshness){
  await pacedSlot();
  let url = settings.proxyUrl.replace(/\/$/,"") + "/?q=" + encodeURIComponent(query) + "&count=8";
  if(freshness) url += "&freshness=" + freshness;
  if(settings.proxySecret) url += "&k=" + encodeURIComponent(settings.proxySecret);
  let lastErr = "";
  for(let attempt=0; attempt<3; attempt++){
    if(attempt>0) await pacedSlot();                      // re-pace before each retry
    try{
      const ctl = new AbortController();
      const timer = setTimeout(()=>ctl.abort(), 15000);   // 15s timeout per request
      const res = await fetch(url, { signal: ctl.signal });
      clearTimeout(timer);
      if(res.status === 429){ lastErr="rate limited"; await new Promise(r=>setTimeout(r, 1500*(attempt+1))); continue; }
      if(!res.ok){ lastErr="HTTP "+res.status; await new Promise(r=>setTimeout(r, 800*(attempt+1))); continue; }
      const data = await res.json();
      const web = (data.web?.results||[]).map(r=>({ t:r.title, u:r.url,
        d:(r.description||"").replace(/<[^>]+>/g,""), age:r.age||"", kind:"web" }));
      const news = (data.news?.results||[]).map(r=>({ t:r.title, u:r.url,
        d:(r.description||"").replace(/<[^>]+>/g,""), age:r.age||"", kind:"news" }));
      return [...news, ...web];
    }catch(e){
      lastErr = e.name==="AbortError" ? "timeout" : (e.message||"network error");
      await new Promise(r=>setTimeout(r, 900*(attempt+1)));
    }
  }
  rlog(`  \u26a0 search skipped ("${query.slice(0,40)}"): ${lastErr}`);
  return [];
}

// ══════════════════════════════════════════════════════════
// DATA CAPABILITY LAYER — the Worker's non-search routes
// Deterministic detection + fetch. Online, Claude can also call
// these as tools; offline, code fetches them and injects results.
// ══════════════════════════════════════════════════════════
function proxyBase(){ return settings.proxyUrl.replace(/\/$/,""); }
function secretParam(){ return settings.proxySecret ? ("k=" + encodeURIComponent(settings.proxySecret)) : "_=1"; }

async function proxyGet(pathAndQuery){
  await pacedSlot();
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 15000);
  try{
    const res = await fetch(proxyBase() + pathAndQuery + (pathAndQuery.includes("?")?"&":"?") + secretParam(), { signal: ctl.signal });
    clearTimeout(timer);
    if(!res.ok) return { error: "HTTP "+res.status };
    return await res.json();
  }catch(e){ return { error: e.name==="AbortError" ? "timeout" : (e.message||"network error") }; }
}

async function fetchQuote(symbol){ return proxyGet("/quote?symbol=" + encodeURIComponent(symbol)); }
async function fetchMacro(series){ return proxyGet("/macro?series=" + encodeURIComponent(series)); }
async function fetchWeather(lat, lon){ return proxyGet(`/weather?lat=${lat}&lon=${lon}`); }
async function fetchCountry(indicator, country){ return proxyGet(`/country?indicator=${indicator}&country=${country}`); }
async function fetchGeocode(place){ return proxyGet("/geocode?q=" + encodeURIComponent(place)); }

// Extract a place name from a weather question ("weather in Kranidi" -> "Kranidi")
function extractPlace(text){
  const STOP = /\b(today|tomorrow|tonight|this|next|now|please|weather|forecast|temperature|like|going|the)\b/i;
  const grab = (m) => {
    if(!m) return null;
    let p = m[1].trim();
    const stop = p.search(STOP);
    if(stop > 0) p = p.slice(0, stop).trim();
    p = p.replace(/[?.!,]+$/,"").trim();
    return p || null;
  };
  let m = text.match(/\b(?:weather|forecast|temperature|rain|snow|climate)\b[^.?!]*?\b(?:in|at|for|near)\s+([A-Z][A-Za-z\u00C0-\u017F' -]{1,40})/);
  let r = grab(m); if(r) return r;
  m = text.match(/\b(?:in|at|for|near)\s+([A-Z][A-Za-z\u00C0-\u017F' -]{1,40}?)\s+(?:weather|forecast|temperature)/i);
  return grab(m);
}
const WCODE = {0:"clear",1:"mainly clear",2:"partly cloudy",3:"overcast",45:"fog",48:"rime fog",51:"light drizzle",53:"drizzle",55:"heavy drizzle",61:"light rain",63:"rain",65:"heavy rain",71:"light snow",73:"snow",75:"heavy snow",77:"snow grains",80:"rain showers",81:"rain showers",82:"violent rain showers",85:"snow showers",86:"snow showers",95:"thunderstorm",96:"thunderstorm w/ hail",99:"thunderstorm w/ hail"};
function wdesc(code){ return WCODE[code] || ("code "+code); }

// Common FRED series with plain-language triggers
const MACRO_SERIES = [
  { id:"DGS10",     name:"US 10-year Treasury yield", triggers:["interest rate","treasury","yield","10-year","bond"] },
  { id:"FEDFUNDS",  name:"Fed funds rate",            triggers:["fed funds","federal reserve rate","policy rate","fed rate"] },
  { id:"CPIAUCSL",  name:"US CPI (inflation)",        triggers:["inflation","cpi","consumer price"] },
  { id:"UNRATE",    name:"US unemployment rate",      triggers:["unemployment","jobless"] },
  { id:"DCOILWTICO",name:"WTI crude oil price",       triggers:["oil price","crude","wti","oil"] },
  { id:"DHHNGSP",   name:"Henry Hub natural gas price",triggers:["natural gas","gas price","henry hub","lng"] },
  { id:"DEXCAUS",   name:"CAD per USD exchange rate", triggers:["cad","canadian dollar","exchange rate","loonie"] },
];

// Detect a stock ticker in free text. Matches $TSLA, TOU.TO, "ticker AAPL", bare 1-5 caps with context.
function detectTicker(text){
  const t = text.toUpperCase();
  let m = t.match(/\$([A-Z]{1,5}(?:\.[A-Z]{1,2})?)/);           // $TSLA / $TOU.TO
  if(m) return m[1];
  m = t.match(/\b([A-Z]{1,5}\.(?:TO|V|CN|NE))\b/);              // TOU.TO explicit exchange
  if(m) return m[1];
  m = t.match(/\b(?:TICKER|STOCK|SYMBOL|SHARES?\s+OF)\s+([A-Z]{1,5}(?:\.[A-Z]{1,2})?)\b/);
  if(m) return m[1];
  return null;
}

// Which macro series are relevant to a question (by trigger words)
function detectMacro(text){
  const t = text.toLowerCase();
  return MACRO_SERIES.filter(s => s.triggers.some(tr => t.includes(tr)));
}

// Does the question ask about weather at a place?
function detectWeather(text){
  return /\b(weather|forecast|temperature|rain|snow|umbrella|how (hot|cold)|climate today)\b/i.test(text);
}

// Gather all relevant live data for a question. Returns { blocks:[strings], summary, quote }
async function gatherLiveData(question, opts={}){
  const blocks = []; let quote = null;
  const ticker = detectTicker(question);
  if(ticker){
    if(opts.log) opts.log(`Fetching live quote for ${ticker}…`);
    const q = await fetchQuote(ticker);
    if(q && !q.error && q.price != null){
      quote = q;
      const parts = [`${q.name||ticker} (${q.symbol}) — ${q.price} ${q.currency||""}`];
      if(q.change != null) parts.push(`change ${q.change} (${q.changePercent}%)`);
      if(q.dayLow != null) parts.push(`day ${q.dayLow}-${q.dayHigh}`);
      if(q.fiftyTwoWeekLow != null) parts.push(`52wk ${q.fiftyTwoWeekLow}-${q.fiftyTwoWeekHigh}`);
      if(q.volume != null) parts.push(`vol ${q.volume}`);
      if(q.marketCap != null) parts.push(`mkt cap ${q.marketCap}`);
      blocks.push(`LIVE QUOTE (${q.source||"proxy"}${q.asOf?", as of "+q.asOf:""}): ${parts.join(", ")}`);
    } else if(opts.log) opts.log(`  quote unavailable (${q?.error||"no data"}) — proceeding with search only.`);
  }
  const macros = detectMacro(question);
  for(const mseries of macros.slice(0,3)){
    if(opts.log) opts.log(`Fetching ${mseries.name}…`);
    const md = await fetchMacro(mseries.id);
    if(md && !md.error && md.latest){
      blocks.push(`LIVE ${mseries.name}: ${md.latest.value} (as of ${md.latest.date})`);
    }
  }
  // WEATHER
  if(detectWeather(question)){
    let lat=null, lon=null, placeName=null;
    const place = extractPlace(question);
    if(place){
      if(opts.log) opts.log(`Locating ${place}…`);
      const g = await fetchGeocode(place);
      if(g && !g.error){ lat=g.lat; lon=g.lon; placeName=`${g.name}${g.country?", "+g.country:""}`; }
    }
    // fall back to profile location coordinates if no place named
    if(lat==null && profile.lat!=null){ lat=profile.lat; lon=profile.lon; placeName=profile.location||"your location"; }
    if(lat!=null){
      if(opts.log) opts.log(`Fetching weather for ${placeName}…`);
      const wx = await fetchWeather(lat, lon);
      if(wx && !wx.error && wx.current){
        const c = wx.current;
        let line = `LIVE WEATHER (${placeName}): now ${c.temperature_2m}°, ${wdesc(c.weather_code)}, feels ${c.apparent_temperature}°, wind ${c.wind_speed_10m} km/h.`;
        if(wx.daily && wx.daily.time){
          const days = wx.daily.time.slice(0,4).map((d,i)=>`${d}: ${wx.daily.temperature_2m_min[i]}–${wx.daily.temperature_2m_max[i]}° ${wdesc(wx.daily.weather_code[i])}`).join("; ");
          line += ` Forecast — ${days}.`;
        }
        blocks.push(line);
      }
    }
  }
  return { blocks, quote, ticker, hadData: blocks.length>0 };
}

function rlog(msg){ research.log.push(msg);
  try{ localStorage.setItem("nous.lastlog", JSON.stringify(research.log)); }catch(e){}
  if(tab==="research") renderTab(); }

// Turn a saved report into offline fact-cards. Chunked (long reports blew the
// old single 3000-token call and truncated the JSON), salvage-tolerant, and it
// returns the number ACTUALLY embedded rather than the number requested.
async function extractReportFacts(rec, log){
  const text = rec.report || "";
  const chunks = [];
  for(let i=0; i<text.length; i+=9000) chunks.push(text.slice(i, i+9000));
  let total = 0, parsedCards = 0;
  for(let ci=0; ci<chunks.length; ci++){
    if(log) log(`Extracting facts — section ${ci+1}/${chunks.length}…`);
    let cards = [];
    try{
      const raw = await claude([{ role:"user", content:
`Extract atomic facts from this research report section for an offline knowledge base.
Each fact: self-contained, ONE idea, meaningful without the report. Keep concrete figures, dates, names,
and note where sources disagree. Aim for 12-25 facts. Prefer fewer complete facts over many truncated ones.
REPORT SECTION (from "${rec.topic}"):\n${chunks[ci]}
Return ONLY JSON: {"facts":[{"text":"...","category":"episodic|interest|procedure","aliases":["..."],"confidence":"high|medium|low"}]}` }],
        { model: settings.planModel, maxTokens: 8000 });
      cards = parseCards(raw, "facts");
    }catch(e){ if(log) log(`  section ${ci+1} failed: ${e.message}`); continue; }
    if(!cards.length){ if(log) log(`  section ${ci+1}: nothing parsed.`); continue; }
    parsedCards += cards.length;
    const n = await addFacts(cards, "research-report");
    total += n;
    if(log) log(`  section ${ci+1}: ${n} of ${cards.length} stored${n<cards.length?" (rest were duplicates)":""}.`);
  }
  if(log && parsedCards && !total) log("  all facts were already in your knowledge base.");
  return total;
}

async function runResearch(question, depth){
  if(!settings.apiKey){ alert("Add your Anthropic API key in Settings first."); return; }
  if(!navigator.onLine){ alert("Research needs an internet connection."); return; }
  research = { running:true, log:[], report:null, question };
  renderTab();
  try{
    // PLAN (cheap model)
    rlog("Planning research dimensions…");
    const planRaw = await claude([{ role:"user", content:
`Break this research request into a focused plan: "${question}"
Note: live stock quotes (price, 52-week range, volume) and key economic series (gas, oil, rates, CPI, FX) are AUTOMATICALLY attached separately, so do NOT waste a dimension on "current price" — focus web searches on news, analysis, catalysts, competition, risks, and opinion.
Identify 4-7 distinct dimensions to investigate. For each, give 1-2 specific web search queries.
Mark time-sensitive dimensions (news, prices, current events) with "fresh":true.
Return ONLY JSON: {"topic":"short label","dimensions":[{"name":"...","queries":["..."],"fresh":true|false}]}` }],
      { model: settings.planModel, maxTokens: 1500 });
    const plan = parseJSON(planRaw);
    rlog(`Plan: ${plan.dimensions.length} dimensions.`);

    // LIVE DATA (quotes / macro) before web search
    const live = await gatherLiveData(question, { log: rlog });
    if(live.hadData) rlog(`Attached ${live.blocks.length} live data point(s).`);

    // GATHER (layer 1)
    let evidence = [];
    for(const dim of plan.dimensions){
      for(const q of dim.queries.slice(0, depth>=3?2:1)){
        rlog(`Searching: ${q}`);
        const hits = await braveSearch(q, dim.fresh?"pw":null);
        evidence.push({ dim:dim.name, q, hits });
      }
    }

    // DEEPEN (conditional layer 2+, only for Standard/Deep)
    if(depth >= 2){
      rlog("Reviewing findings for gaps…");
      const digest = evidence.map(e=>`[${e.dim}] ${e.q}\n`+e.hits.slice(0,4).map(h=>`- ${h.t}: ${h.d}`).join("\n")).join("\n\n").slice(0, 9000);
      const gapRaw = await claude([{ role:"user", content:
`Research question: "${question}"
Findings so far:\n${digest}\n
Identify gaps, contradictions, or unverified claims worth a second search wave. Give up to ${depth>=3?6:3} targeted follow-up queries.
Return ONLY JSON: {"followups":[{"query":"...","fresh":true|false}]}` }],
        { model: settings.planModel, maxTokens: 1000 });
      const gap = parseJSON(gapRaw);
      for(const f of (gap.followups||[])){
        rlog(`Deeper: ${f.query}`);
        const hits = await braveSearch(f.query, f.fresh?"pw":null);
        evidence.push({ dim:"follow-up", q:f.query, hits });
      }
    }

    const totalHits = evidence.reduce((n,e)=>n+e.hits.length, 0);
    if(totalHits === 0 && !live.hadData){
      throw new Error("No search results or live data returned — open your Worker URL with ?q=test in Safari to check it's live, and verify the proxy URL in Settings.");
    }
    rlog(`Gathered ${totalHits} results across ${evidence.length} searches.`);
    // SYNTHESIZE (strong model)
    rlog("Synthesizing report…");
    let corpus = evidence.map(e=>`### ${e.dim} — "${e.q}"\n`+
      e.hits.map(h=>`- [${h.kind}${h.age?", "+h.age:""}] ${h.t}\n  ${h.d}\n  ${h.u}`).join("\n")).join("\n\n").slice(0, 16000);
    if(live.hadData){
      corpus = "## LIVE MARKET/ECONOMIC DATA (authoritative — prefer over article estimates):\n" +
        live.blocks.join("\n") + "\n\n" + corpus;
    }
    const sys = `You are a research analyst. Write a thorough, balanced report from the gathered evidence. `+
      `Cite sources inline as [n] with a numbered Sources list. Surface DISAGREEMENTS between sources rather than smoothing them. `+
      `For any forecast/opinion question, include explicit bull and bear cases. Be honest about uncertainty and evidence gaps. `+
      `If LIVE MARKET/ECONOMIC DATA is provided, use those exact figures for prices/levels/rates rather than estimates from articles, but note that quote data may be delayed (not real-time) and technical levels should be confirmed on a live platform. Use markdown.`;
    const report = await claude([{ role:"user", content:
`Research question: "${question}"\n\nGATHERED EVIDENCE:\n${corpus}\n\nWrite the report now.` }],
      { system: sys, maxTokens: 4000 });

    const rec = { id:Date.now(), question, topic:plan.topic||question.slice(0,40),
      report, created:Date.now(), searches:evidence.length, factCount:0 };
    reports.unshift(rec); save(LS.reports, reports);   // save BEFORE extraction — never lose the report

    rlog("Decomposing into offline facts…");
    try{
      rec.factCount = await extractReportFacts(rec, rlog);
      save(LS.reports, reports);
      rlog(rec.factCount ? `Stored ${rec.factCount} facts — offline recall ready.`
                         : "No facts extracted — use “Re-extract facts” on the report to retry.");
    }catch(e){
      rlog("Fact extraction failed: "+e.message+" — report saved; tap “Re-extract facts” to retry.");
    }
    research = { running:false, log:research.log, report:rec };
    rlog("Done.");
  }catch(e){
    research.running = false; rlog("Failed: "+e.message);
  }
  renderTab();
}

const DECOMPOSE_RULES = `Decompose into ATOMIC facts: one self-contained idea each, meaningful out of context, short.
If a new fact contradicts/updates a likely older one, add "replaces":["exact old fact text"] so the old one is archived.
Return ONLY JSON: {"profile":"a 60-120 word standing profile paragraph (who they are, where, key context)",
"facts":[{"text":"...","category":"identity|ambient|interest|episodic|procedure","aliases":["..."],"confidence":"high|medium|low","replaces":["..."]}]}`;

async function runOnboard(){

                 interests:g("obInterests"), extra:g("obExtra") };

Name: ${info.name}\nHome: ${info.home}\nCurrent location: ${info.now}\nWork/projects: ${info.work}\nInterests: ${info.interests}\nOther details: ${info.extra}

For the ambient layer, use web search to also add ~10 practical facts about their current location (emergency number, main hospital, timezone, climate now, key local practicalities).

async function ingestPdf(ev){
  const file = ev.target.files[0]; if(!file) return;
  if(!settings.apiKey){ setBuildStatus("Add your Anthropic API key in Settings first."); return; }
  document.getElementById("pdfName").textContent = file.name;
  busy = true; setBuildStatus("Loading PDF engine…");
  try{
    const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs";
    const buf = await file.arrayBuffer();
    setBuildStatus("Reading pages…");
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    let text = "";
    for(let p=1; p<=doc.numPages; p++){
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      text += content.items.map(i=>i.str).join(" ") + "\n";
      if(p % 3 === 0) setBuildStatus(`Reading page ${p}/${doc.numPages}…`);
    }
    text = text.replace(/\s+/g, " ").trim();
    if(!text){ setBuildStatus("No extractable text (scanned PDF?). Try a text-based PDF."); busy=false; return; }
    // chunk into ~6000-char sections; decompose each into facts
    const chunks = [];
    for(let i=0; i<text.length; i+=6000) chunks.push(text.slice(i, i+6000));
    let total = 0;
    for(let ci=0; ci<chunks.length; ci++){
      setBuildStatus(`Extracting facts from section ${ci+1}/${chunks.length}…`);
      const prompt = `Extract atomic facts from this document section (from "${file.name}"). Each self-contained, one idea, useful for later recall.
SECTION:\n${chunks[ci]}
Return ONLY JSON: {"facts":[{"text":"...","category":"identity|ambient|interest|episodic|procedure","aliases":["..."],"confidence":"high|medium|low"}]}`;
      try{
        const raw = await claude([{ role:"user", content: prompt }], { model: settings.planModel, maxTokens: 8000 });
        const cards = parseCards(raw, "facts");
        total += await addFacts(cards, "pdf:"+file.name.slice(0,30), setBuildStatus);
      }catch(e){ setBuildStatus(`Section ${ci+1} skipped: ${e.message}`); }
    }
    setBuildStatus(`Imported ${total} facts from ${file.name} (${doc.numPages} pages).`);
  }catch(e){ setBuildStatus("PDF import failed: "+e.message); }
  busy = false; render();
}
window.ingestPdf = ingestPdf;
function setBuildStatus(t){ const el=document.getElementById("buildStatus"); if(el) el.textContent=t; }

// ── reflection ──
async function runReflection(){
  if(!settings.apiKey){ alert("Add your API key in Settings first."); return; }
  busy = true; renderTab();
  try{
    const recent = sessions.slice(-6).map(s =>
      s.turns.map(t=>`${t.role}: ${t.text}`).join("\n")).join("\n---\n").slice(-12000);
    const gapList = gaps.slice(-30).map(g=>g.q).join("\n");
    const prompt = `You are the reflection pass of a personal assistant. Analyze recent conversations and offline knowledge gaps.

RECENT CONVERSATIONS:\n${recent||"(none)"}\n\nOFFLINE GAPS (questions we had no stored answer for):\n${gapList||"(none)"}

Tasks: 1) Find topics recurring across MULTIPLE sessions (ignore one-offs). 2) Cross-reference with gaps. 3) For each recurring theme or gap, use web search if needed and propose NEW atomic facts (or step-by-step "procedure" facts) that would help the assistant next time. 4) If the user's situation changed, propose an updated profile paragraph.

Return ONLY JSON: {"themes":["..."],"updatedProfile":"string or null",
"proposals":[{"text":"...","category":"ambient|interest|episodic|procedure","aliases":["..."],"confidence":"high|medium|low","reason":"why this helps"}]}`;
    const raw = await claude([{ role:"user", content: prompt }], { webSearch:true, maxTokens:8000 });
    let out = {}; try{ out = parseJSON(raw) || {}; }catch(e){}
    if(!Array.isArray(out.proposals) || !out.proposals.length) out.proposals = parseCards(raw, "proposals");
    reflect = { lastRun: Date.now(), themes: out.themes||[],
                updatedProfile: out.updatedProfile||null,
                proposals: (out.proposals||[]).map(p=>({ ...p, id:Date.now()+Math.random() })) };
    save(LS.reflect, reflect);
  }catch(e){ alert("Reflection failed: "+e.message); }
  busy = false; renderTab();
}
async function approveProposal(id){
  const p = reflect.proposals.find(x=>x.id===id); if(!p) return;
  busy = true; renderTab();
  await addFacts([p], "reflection");
  reflect.proposals = reflect.proposals.filter(x=>x.id!==id);
  save(LS.reflect, reflect);
  gaps = []; save(LS.gaps, gaps);
  busy = false; renderTab();
}
function rejectProposal(id){
  reflect.proposals = reflect.proposals.filter(x=>x.id!==id);
  save(LS.reflect, reflect); renderTab();
}
function acceptProfile(){
  if(reflect.updatedProfile){ profile.text = reflect.updatedProfile; save(LS.profile, profile);
    reflect.updatedProfile = null; save(LS.reflect, reflect); renderTab(); }
}

// Read every Settings control currently on screen into `settings`. Called before
// any action that re-renders or loads a model, so an unsaved dropdown change is
// never silently discarded (the old Download button read the SAVED model, not the
// selected one, so picking a bigger model then tapping Download re-fetched the old).
function captureSettingsFields(){
  if(tab !== "set") return;
  if($("setKey"))    settings.apiKey      = $("setKey").value.trim();
  if($("setRoute"))  settings.route       = $("setRoute").value;
  if($("setProxy"))  settings.proxyUrl    = $("setProxy").value.trim();
  if($("setSecret")) settings.proxySecret = $("setSecret").value.trim();
  if($("setModel"))  settings.webllmModel = $("setModel").value;
  if($("setVoice"))  settings.ttsVoice    = $("setVoice").value;
  if($("setRate"))   settings.ttsRate     = parseFloat($("setRate").value||"1.0");
  if($("setPitch"))  settings.ttsPitch    = parseFloat($("setPitch").value||"1.0");
}
function commitSettings(){ captureSettingsFields(); settings.savedAt = Date.now(); save(LS.settings, settings); }

// ── models preload (Settings) ──
async function initModels(){
  commitSettings();                 // honour the dropdown selection, not the stale saved one
  busy = true;
  const status = (t,p)=>{ const el=document.getElementById("modelStatus"); if(el) el.textContent=t;
    const bar=document.getElementById("modelProg");
    if(bar){ bar.style.display="block"; if(p!==undefined) bar.firstElementChild.style.width=Math.round(p*100)+"%"; } };
  const label = (WEBLLM_MODELS.find(m=>m.id===settings.webllmModel)||{}).label || settings.webllmModel;
  try{
    await getEmbedder(status);
    status("Embedding model ready ✓");
    if(webgpuOK()){ await getEngine(status); status(`Ready ✓ — ${label} is loaded and cached for offline.`); }
    else status("Embedding ready ✓ — but no WebGPU on this browser, so offline chat is unavailable (retrieval + online chat still work).");
  }catch(e){ status("Failed: "+e.message); }
  busy = false;
  renderTab();
}

function mdToHtml(md){
  let h = esc(md);
  h = h.replace(/^### (.*)$/gm,'<div style="font-weight:700;color:#E8B84B;margin-top:12px;">$1</div>');
  h = h.replace(/^## (.*)$/gm,'<div style="font-weight:700;font-size:16px;color:#E8B84B;margin-top:14px;">$1</div>');
  h = h.replace(/^# (.*)$/gm,'<div style="font-weight:700;font-size:17px;color:#E8B84B;margin-top:14px;">$1</div>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/^\s*[-*] (.*)$/gm,'<div style="margin-left:12px;">\u2022 $1</div>');
  h = h.replace(/\[(\d+)\]/g,'<sup style="color:#E8B84B;">[$1]</sup>');
  h = h.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  return h;
}
async function updateStorageMeter(){
  const el = document.getElementById("storageMeter"); if(!el) return;
  try{
    let line = "";
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      const mb = n => (n/1048576).toFixed(0);
      line += `Storage: ${mb(est.usage||0)} MB used of ${mb(est.quota||0)} MB available.`;
    }
    if(navigator.storage && navigator.storage.persisted){
      const p = await navigator.storage.persisted();
      line += ` Persistent: ${p?"yes \u2713 (protected from eviction)":"no \u2014 may be purged under pressure"}`;
    }
    el.textContent = line || "Storage info unavailable.";
  }catch(e){ el.textContent = "Storage info unavailable."; }
}
window.updateStorageMeter = updateStorageMeter;

function reportMarkdown(r){
  const date = new Date(r.created).toLocaleString();
  return `# ${r.topic}\n\n**Research question:** ${r.question}\n**Generated:** ${date}\n**Sources searched:** ${r.searches}\n\n---\n\n${r.report}\n`;
}
window.exportReportMd = id => {
  const r = reports.find(x=>x.id===id); if(!r) return;
  const blob = new Blob([reportMarkdown(r)], { type:"text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (r.topic||"report").replace(/[^\w\-]+/g,"_").slice(0,50) + ".md";
  document.body.appendChild(a); a.click(); a.remove();
};
window.exportReportPdf = id => {
  const r = reports.find(x=>x.id===id); if(!r) return;
  // Build a clean printable HTML doc and hand it to the browser's print -> Save as PDF
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(r.topic)}</title>
<style>
  body{font-family:Georgia,serif;max-width:720px;margin:32px auto;padding:0 20px;color:#1a1a1a;line-height:1.6;}
  h1{font-size:24px;border-bottom:2px solid #E8B84B;padding-bottom:8px;}
  h2{font-size:18px;margin-top:24px;} h3{font-size:15px;color:#7a5a10;}
  .meta{color:#666;font-size:13px;margin-bottom:24px;}
  sup{color:#b8860b;} a{color:#0645ad;word-break:break-all;}
  @media print{ body{margin:0;} }
</style></head><body>
<h1>${esc(r.topic)}</h1>
<div class="meta"><b>Question:</b> ${esc(r.question)}<br><b>Generated:</b> ${esc(new Date(r.created).toLocaleString())} &middot; ${r.searches} searches</div>
${mdToHtmlPrint(r.report)}
<script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script>
</body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("Allow pop-ups for this site to export PDF, or use .md export."); return; }
  w.document.write(html); w.document.close();
};
// print-friendly markdown -> html (dark-theme colors stripped)
function mdToHtmlPrint(md){
  let h = esc(md);
  h = h.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  h = h.replace(/^## (.*)$/gm,'<h2>$1</h2>');
  h = h.replace(/^# (.*)$/gm,'<h2>$1</h2>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>)/gs, m=>'<ul>'+m+'</ul>');
  h = h.replace(/\[(\d+)\]/g,'<sup>[$1]</sup>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');
  h = h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}
window.discussReport = id => {
  const r = reports.find(x=>x.id===id); if(!r) return;
  // start a fresh chat session primed with this report as focused context
  startSession({ reportContext:{ topic:r.topic, text:r.report } });
  session.turns.push({ role:"ai", via:"discussing report",
    text:`Let's dig into "${r.topic}". Ask me anything about this research \u2014 I have the full report in context.`, ts:Date.now() });
  tab = "chat"; render();
};
window.reextractFacts = async id => {
  const r = reports.find(x=>x.id===id); if(!r) return;
  if(!settings.apiKey){ alert("Add your Anthropic API key in Settings first."); return; }
  if(!navigator.onLine){ alert("Re-extracting needs an internet connection."); return; }
  research = { running:true, log:[], report:r };
  renderTab();
  try{
    rlog(`Re-extracting offline facts from "${r.topic}"…`);
    const n = await extractReportFacts(r, rlog);
    r.factCount = (r.factCount||0) + n;
    save(LS.reports, reports);
    rlog(n ? `Done — ${n} new facts stored. Ask about this offline now.`
           : "No new facts stored (already present, or extraction returned nothing).");
  }catch(e){ rlog("Failed: "+e.message); }
  research.running = false; renderTab();
};
window.closeReport = () => { research = { running:false, log:[], report:null }; renderTab(); };
window.deleteReport = id => {
  if(!confirm("Delete this report? (Facts already saved to your knowledge base stay.)")) return;
  reports = reports.filter(r=>r.id!==id);
  save(LS.reports, reports);
  if(research.report && research.report.id===id) research.report = null;
  renderTab();
};
window.openReport = id => { research = { running:false, log:[], report: reports.find(r=>r.id===id) }; renderTab(); window.scrollTo(0,0); };
window.speakReport = id => { const r = reports.find(x=>x.id===id); if(r) speak(r.report.replace(/[#*\[\]]/g,"").slice(0,4000)); };

// ── window actions ──
window.setTab = t => { tab = t; render(); };
window.sendMsg = sendMsg;
window.runOnboard = runOnboard;
window.learnTopic = learnTopic;
window.runReflection = runReflection;
window.approveProposal = approveProposal;
window.rejectProposal = rejectProposal;
window.acceptProfile = acceptProfile;
window.initModels = initModels;
window.exportAll = exportAll;
window.importAll = importAll;
window.deleteFact = deleteFact;
window.renderTab = renderTab;
window.refreshVoices = () => {
  captureSettingsFields(); commitSettings();
  loadVoices();
  // iOS often only populates the list after a first utterance
  if(!voiceList.length){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); }catch(e){} }
  setTimeout(()=>{ loadVoices(); renderTab(); }, 350);
};
window.previewVoice = () => {
  commitSettings();
  const was = settings.tts; settings.tts = true;
  speak("This is how I'll read your answers. Adjust the voice, speed and pitch until it sounds right.");
  settings.tts = was;
  setTimeout(()=>{ if(!voiceList.length){ loadVoices(); if(voiceList.length) renderTab(); } }, 400);
};
window.dismissCrash = () => { lastCrash = null; render(); };
window.enableLowMem = () => {
  settings.lowMem = true; commitSettings(); lastCrash = null;
  // the running engine was built with the old context window — drop it
  freeEngine().then(render);
};
window.stepDownModel = async () => {
  const cur = modelInfo(settings.webllmModel);
  const smaller = WEBLLM_MODELS.find(m => m.mb < cur.mb) || WEBLLM_MODELS[1];
  lastCrash = null;
  await window.setWebllmModel(smaller.id);
  tab = "set"; render();
};
window.toggleLowMem = () => { captureSettingsFields(); settings.lowMem = !settings.lowMem;
  commitSettings(); freeEngine().then(renderTab); };
async function freeEngine(){
  if(engine){ try{ if(engine.unload) await engine.unload(); }catch(e){} }
  engine = null; engineModel = null;
}
window.freeMemory = async () => {
  await freeEngine();
  const el = $("modelStatus"); if(el) el.textContent = "Model released from memory ✓ (reloads from cache on next offline question)";
  renderTab();
};
window.setWebllmModel = async id => {
  if(!WEBLLM_MODELS.some(m=>m.id===id)) return;
  captureSettingsFields();
  settings.webllmModel = id;
  commitSettings();
  // drop the old engine so we don't hold two models in memory on the phone
  if(engine && engineModel !== id) await freeEngine();
  renderTab();
};
window.saveSettings = () => {
  commitSettings();
  const el = $("modelStatus"); if(el) el.textContent = "Saved ✓";
  render();
};
window.toggleTTS = () => { captureSettingsFields(); settings.tts = !settings.tts; commitSettings(); renderTab(); };
window.newChat = () => { if(busy) return; startSession(); tab="chat"; render(); };
window.clearChat = window.newChat;                       // Settings button alias
window.toggleChatMenu = () => { chatMenu = !chatMenu; renderTab(); };
window.showFullChat = () => { chatFull = true; renderTab(); };
window.openSession = id => {
  if(busy) return;
  const s = sessions.find(x => x.id===id); if(!s) return;
  session = s; chatFull = false; chatMenu = false; tab = "chat"; render();
};
window.deleteSession = id => {
  if(busy) return;
  if(!confirm("Delete this chat? Stored facts are unaffected.")) return;
  sessions = sessions.filter(s => s.id!==id);
  if(session.id===id){
    const last = sessions[sessions.length-1];
    if(last) session = last; else startSession();
  }
  save(LS.sessions, sessions);
  render();
};

document.getElementById("chatIn").addEventListener("keydown", e => { if(e.key==="Enter") sendMsg(); });
window.addEventListener("online", render);
window.addEventListener("offline", render);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

// Boot: load storage (async), then render. Show a tiny loading state first.
document.getElementById("main").innerHTML = '<div class="muted" style="padding:24px;">Loading your knowledge base…</div>';
initStorage().then(() => {
  render();
  // nightly reflection nudge
  if(navigator.onLine && settings.apiKey && Date.now()-reflect.lastRun > 86400000 &&
     (gaps.length>2 || sessions.length>3)){
    setTimeout(()=>{ if(tab==="chat" && session.turns.length===0){
      session.turns.push({ role:"ai", via:"reflection nudge",
        text:"It's been a while since I reflected on our conversations — open the Reflect tab and I'll propose what to learn next.", ts:Date.now() });
      render(); } }, 1500);
  }
}).catch(e => {
  document.getElementById("main").innerHTML = '<div class="card">Storage failed to load: '+e.message+'</div>';
});
</script>
